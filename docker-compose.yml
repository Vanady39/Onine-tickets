# Online Tickets: PostgreSQL + Go API + React web (nginx). Open http://localhost:8080.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickets}
      POSTGRES_DB: tickets
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://tickets:${POSTGRES_PASSWORD:-tickets}@db:5432/tickets?sslmode=disable
      ADDR: ":8080"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      WEB_URL: ${PUBLIC_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      PAYMENT_SECRET: ${PAYMENT_SECRET:-change-me-payment-secret}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-demo-pass-123}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  db-data:
